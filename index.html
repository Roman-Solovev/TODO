<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>TODO</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main class="app">
            <h2>To Do List</h2>
            <form id="todoForm">
                <input id="todo" type="text" name="todo" required placeholder="New task title"/>
                <button type="submit">Add</button>
            </form>
            <label class="search">
                <input id="search" type="search" placeholder="Search task"/>
                <svg class="search__icon" viewBox="0 0 24 24" width="18" height="18"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                </svg>
            </label>
            <div class="summary">
                <p class="counting"></p>
                <button type="button" class="deleteAll">Delete All</button>
            </div>
            <div class="taskList"></div>
        </main>
        <script src="app.js" defer></script>
    </body>
</html>
